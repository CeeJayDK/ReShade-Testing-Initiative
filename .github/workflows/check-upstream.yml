name: Check upstream ReShade version

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the Build workflow for the new tag

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find latest official ReShade version tag
        id: upstream
        run: |
          # crosire tracks releases via tags (not always a formal GitHub
          # "Release" object), so read tags directly via git rather than
          # the REST API - this also avoids API rate limits entirely.
          # Only match clean vMAJOR.MINOR.REVISION tags, so a pre-release
          # like v6.9.0-rc1 is never picked up as "latest official".
          LATEST=$(git ls-remote --tags --refs https://github.com/crosire/reshade.git \
            | awk '{print $2}' | sed 's#refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "Could not determine latest ReShade tag" >&2
            exit 1
          fi
          echo "Latest upstream tag: $LATEST"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare to currently tracked version
        id: compare
        run: |
          CURRENT="$(cat RESHADE_VERSION 2>/dev/null | tr -d '[:space:]')"
          echo "Currently tracked: $CURRENT"
          if [ "$CURRENT" != "${{ steps.upstream.outputs.tag }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump RESHADE_VERSION
        id: bump
        if: steps.compare.outputs.changed == 'true'
        run: |
          NEW="${{ steps.upstream.outputs.tag }}"

          # Guard against re-tagging if this ever runs twice for the same version
          if git rev-parse "$NEW" >/dev/null 2>&1; then
            echo "Tag $NEW already exists on this repo, skipping."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$NEW" > RESHADE_VERSION
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # patches/*.patch and tools/fxc-fix.py are written against one ReShade
      # version. Build against the new one before anything is pushed, so a
      # version they no longer apply to fails here instead of breaking main.
      - name: Install dependencies
        if: steps.bump.outputs.bumped == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q spirv-tools bison flex cmake

      - name: Build against the new version
        if: steps.bump.outputs.bumped == 'true'
        run: ./build_reshade_testing_initiative.sh "$RUNNER_TEMP/bin"

      - name: Commit, tag and start the release build
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="${{ steps.upstream.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RESHADE_VERSION
          git commit -m "Track ReShade $NEW"
          git tag "$NEW"
          git push origin HEAD:main
          git push origin "$NEW"
          # A push made with the workflow's own token does not start other
          # workflows, so the tag alone would never be built or released.
          # workflow_dispatch is the exception: run Build on the tag, which
          # tests it and publishes the release.
          gh workflow run build.yml --ref "$NEW"
