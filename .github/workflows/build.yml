name: Build

# The test corpora, pinned: the tests compare instruction counts, which a commit
# to either repository can change.
env:
  SHADERS_REF: fd0022170615ce0d8162d219bff07232fa6dd84f   # crosire/reshade-shaders
  SWEETFX_REF: 93ddf39b357f5da534ed6d34ba4ec8cc7dcfa361   # CeeJayDK/SweetFX

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q spirv-tools bison flex cmake

      # vkd3d-shader takes most of the build time and only changes with its script.
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('RESHADE_VERSION', 'tools/build-vkd3d-shader.sh', 'tools/idl2h.py', 'patches/vkd3d/*.patch') }}

      - name: Build
        run: ./build_reshade_testing_initiative.sh bin

      - name: Test
        run: |
          fetch() { # url dir commit
            git init --quiet "$2"
            git -C "$2" fetch --quiet --depth 1 "$1" "$3"
            git -C "$2" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          }
          fetch https://github.com/crosire/reshade-shaders.git "$RUNNER_TEMP/reshade-shaders" "$SHADERS_REF"
          fetch https://github.com/CeeJayDK/SweetFX.git "$RUNNER_TEMP/SweetFX" "$SWEETFX_REF"
          I="-I $RUNNER_TEMP/reshade-shaders/Shaders"
          FX="$RUNNER_TEMP/SweetFX/Shaders/SweetFX/LumaSharpen.fx"
          ./bin/reshadefx_cli_fixed --version
          ./bin/reshadefx_cli_fixed --hlsl $I -Fo "$RUNNER_TEMP/out.hlsl" "$FX"
          ./bin/reshadefx_cli_fixed --dxbc --shader-model 50 --list-entry-points $I "$FX"
          # constructs vkd3d rejects, rewritten by cli/vkd3d_hlsl_fixups.hpp
          ./bin/reshadefx_cli_fixed --dxbc --shader-model 50 --all-entry-points -Fo "$RUNNER_TEMP/fixups.cso" cli/tests/vkd3d_fixups.fx
          ./bin/reshadefx_cli_fixed --dxbc --shader-model 40 --all-entry-points -Fo "$RUNNER_TEMP/fixups.cso" cli/tests/vkd3d_fixups.fx
          ./bin/reshadefx_rga --optimize $I "$FX" | tee "$RUNNER_TEMP/rga.txt"
          grep -q "before optimization:" "$RUNNER_TEMP/rga.txt"   # fails if built without SPIRV-Tools
          ./bin/fxstat $I "$FX"
          ./bin/reshadefx_coverage $I --sm 50 "$FX"
          SWEETFX="$RUNNER_TEMP/SweetFX" SHADERS="$RUNNER_TEMP/reshade-shaders" fxstat/test/run_tests.sh

      - uses: actions/upload-artifact@v7
        with:
          name: reshade-testing-initiative-linux-x64
          path: bin/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-spirv-tools

      - name: Build
        shell: cmd
        run: |
          set "PATH=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;%PATH%"
          set "SPIRV_TOOLS_DIR=${{ steps.msys2.outputs.msys2-location }}\mingw64"
          build_reshade_testing_initiative.bat bin

      - name: Test
        shell: pwsh
        run: |
          function Fetch($url, $dir, $commit) {
            git init --quiet $dir
            git -C $dir fetch --quiet --depth 1 $url $commit
            git -C $dir -c advice.detachedHead=false checkout --quiet FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not fetch $url at $commit"; exit 1 }
          }
          Fetch https://github.com/crosire/reshade-shaders.git "$env:RUNNER_TEMP\reshade-shaders" $env:SHADERS_REF
          Fetch https://github.com/CeeJayDK/SweetFX.git "$env:RUNNER_TEMP\SweetFX" $env:SWEETFX_REF
          $I  = "$env:RUNNER_TEMP\reshade-shaders\Shaders"
          $FX = "$env:RUNNER_TEMP\SweetFX\Shaders\SweetFX\LumaSharpen.fx"
          # The binaries are meant to be standalone, but if one ever links a
          # MinGW or SPIRV-Tools DLL it only resolves with MSYS2 on PATH. The
          # Build step's `set PATH` does not survive into this step.
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          # Report the real exit code: a Windows image-load failure (0xC0000135,
          # missing DLL) produces no output at all, and would otherwise show up
          # as a bare "exit code 1" with nothing to go on.
          function Run {
            & $args[0] $args[1..($args.Length-1)]
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$($args[0]) exited with $LASTEXITCODE (0x$('{0:X8}' -f $LASTEXITCODE))"
              exit 1
            }
          }
          Run .\bin\reshadefx_cli_fixed.exe --version
          Run .\bin\reshadefx_cli_fixed.exe --hlsl -I $I -Fo "$env:RUNNER_TEMP\out.hlsl" $FX
          Run .\bin\reshadefx_cli_fixed.exe --dxbc --shader-model 50 --list-entry-points -I $I $FX
          Run .\bin\reshadefx_cli_fixed.exe --dxbc --shader-model 50 --all-entry-points -Fo "$env:RUNNER_TEMP\fixups.cso" cli\tests\vkd3d_fixups.fx
          $rga = & .\bin\reshadefx_rga.exe --optimize -I $I $FX; $rga
          if ($LASTEXITCODE -ne 0 -or -not ($rga -match 'before optimization:')) {
            Write-Host "::error::reshadefx_rga.exe exited with $LASTEXITCODE or printed no optimization counts"
            exit 1
          }
          Run .\bin\fxstat.exe -I $I $FX
          Run .\bin\reshadefx_coverage.exe -I $I --sm 50 $FX

      - uses: actions/upload-artifact@v7
        with:
          name: reshade-testing-initiative-windows-x64
          path: bin/

  release:
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts/reshade-testing-initiative-linux-x64 && chmod +x * && zip -r ../../reshade-testing-initiative-linux-x64.zip . && cd -
          cd artifacts/reshade-testing-initiative-windows-x64 && zip -r ../../reshade-testing-initiative-windows-x64.zip . && cd -

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            reshade-testing-initiative-linux-x64.zip
            reshade-testing-initiative-windows-x64.zip
