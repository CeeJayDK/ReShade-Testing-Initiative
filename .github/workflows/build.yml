name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          chmod +x build_reshadefx_tools.sh
          ./build_reshadefx_tools.sh bin

      - name: Functional test
        run: |
          ./bin/reshadefx_cli --version
          git clone --quiet --depth 1 https://github.com/crosire/reshade-shaders.git "$RUNNER_TEMP/reshade-shaders"
          cat > "$RUNNER_TEMP/test.fx" << 'EOF'
          #include "ReShade.fxh"
          float3 PS_Test(float4 pos : SV_Position, float2 texcoord : TEXCOORD) : SV_Target
          {
          	return tex2D(ReShade::BackBuffer, texcoord).rgb;
          }
          technique Test
          {
          	pass
          	{
          		VertexShader = PostProcessVS;
          		PixelShader = PS_Test;
          	}
          }
          EOF
          ./bin/reshadefx_cli --hlsl -I "$RUNNER_TEMP/reshade-shaders/Shaders" -Fo "$RUNNER_TEMP/out.hlsl" "$RUNNER_TEMP/test.fx"
          ./bin/reshadefx_stats -I "$RUNNER_TEMP/reshade-shaders/Shaders" "$RUNNER_TEMP/test.fx"
          ./bin/reshadefx_rga -I "$RUNNER_TEMP/reshade-shaders/Shaders" "$RUNNER_TEMP/test.fx"

      - uses: actions/upload-artifact@v7
        with:
          name: reshadefx-tools-linux-x64
          path: bin/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install MinGW-w64
        run: choco install mingw --no-progress -y

      - name: Build
        shell: cmd
        run: build_reshadefx_tools.bat bin

      - name: Functional test
        shell: pwsh
        run: |
          & ".\bin\reshadefx_cli.exe" --version
          git clone --quiet --depth 1 https://github.com/crosire/reshade-shaders.git "$env:RUNNER_TEMP\reshade-shaders"
          @'
          #include "ReShade.fxh"
          float3 PS_Test(float4 pos : SV_Position, float2 texcoord : TEXCOORD) : SV_Target
          {
          	return tex2D(ReShade::BackBuffer, texcoord).rgb;
          }
          technique Test
          {
          	pass
          	{
          		VertexShader = PostProcessVS;
          		PixelShader = PS_Test;
          	}
          }
          '@ | Set-Content -Path "$env:RUNNER_TEMP\test.fx"
          & ".\bin\reshadefx_cli.exe" --hlsl -I "$env:RUNNER_TEMP\reshade-shaders\Shaders" -Fo "$env:RUNNER_TEMP\out.hlsl" "$env:RUNNER_TEMP\test.fx"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & ".\bin\reshadefx_stats.exe" -I "$env:RUNNER_TEMP\reshade-shaders\Shaders" "$env:RUNNER_TEMP\test.fx"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & ".\bin\reshadefx_rga.exe" -I "$env:RUNNER_TEMP\reshade-shaders\Shaders" "$env:RUNNER_TEMP\test.fx"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: reshadefx-tools-windows-x64
          path: bin/

  release:
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts/reshadefx-tools-linux-x64 && zip -r ../../reshadefx-tools-linux-x64.zip . && cd -
          cd artifacts/reshadefx-tools-windows-x64 && zip -r ../../reshadefx-tools-windows-x64.zip . && cd -

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            reshadefx-tools-linux-x64.zip
            reshadefx-tools-windows-x64.zip
